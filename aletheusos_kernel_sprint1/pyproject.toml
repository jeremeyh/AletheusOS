[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="aletheusos-kernel"
version="0.1.0"
description="AletheusOS Constitutional Kernel — Sprint 1"
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]

[tool.setuptools.packages.find]
where=["src"]
