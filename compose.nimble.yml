services:
  nimble-experience-gateway:
    build:
      context: .
      dockerfile: Dockerfile.nimble
    image: aletheus/nimble-experience-gateway:local
    environment:
      ALETHEUS_AUTH_MODE: local
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/runtime_state:size=64m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)); raise SystemExit(0 if p.get('status') == 'ready' else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
