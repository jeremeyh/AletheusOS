[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheus"
dynamic = ["version"]
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aletheus*"]

[tool.setuptools.dynamic]
version = {attr = "aletheus.version.__version__"}

[tool.black]
line-length = 88
target-version = ["py313"]

include = '\.pyi?$'

extend-exclude = '''
(
    ^\.git/
  | ^\.venv/
  | ^venv/
  | ^node_modules/
  | ^dist/
  | ^build/
  | ^__pycache__/
  | ^\.pytest_cache/
  | ^\.mypy_cache/
  | ^\.ruff_cache/

  | ^reports/
  | ^coverage/
  | ^htmlcov/

  | ^archive/
  | ^archives/
  | ^history/

  | ^Genesis10_Work_Organization/04_reports/
  | ^Genesis10_Work_Organization/05_archives/

  | .*/backup_.*
  | .*/.*_backup_.*
  | .*/contract_repair_backup_.*
  | .*/result_contract_backup_.*
  | .*/safe_alias_backup_.*
  | .*/registration_catalog_backup_.*
  | .*/guarded_registration_backup_.*
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=prepend"]
