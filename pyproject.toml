[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheus"
version = "4.6.2"
description = "AletheusOS Constitutional Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "6th Dimension Multimedia" }
]

license = { text = "Proprietary" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aletheus*"]

[tool.pytest.ini_options]
minversion = "8.0"

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

norecursedirs = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "archive",
    "build",
    "dist",
    "Genesis-012B-SPAN-Runtime-Integration",
    "aletheusos_kernel_sprint1",
]

addopts = [
    "-ra",
]
