[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheus"
version = "4.6.2"
description = "AletheusOS Constitutional Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "6th Dimension Multimedia" }
]

license = { text = "Proprietary" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aletheus*"]
