name: Nimble Attested Release

on:
  push:
    tags:
      - "nimble-*"

permissions:
  contents: read

concurrency:
  group: nimble-attested-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Attested Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "1"
      NODE_OPTIONS: "--use-system-ca"
      ALETHEUS_AUTH_MODE: "local"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nimble/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install -e .
            python -m pip install pytest
          else
            echo "No supported Python dependency manifest found."
            exit 1
          fi

      - name: Install Nimble dependencies
        working-directory: nimble
        run: npm ci

      - name: Verify tag points to current commit
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"

          echo "Tag commit:  $TAG_COMMIT"
          echo "HEAD commit: $HEAD_COMMIT"

          test "$TAG_COMMIT" = "$HEAD_COMMIT"

      - name: Rebuild production assets
        working-directory: nimble
        run: |
          npm run typecheck
          npm run test -- --run
          npm run build

      - name: Validate production evidence
        run: |
          python validate_nimble_telemetry.py
          python validate_nimble_performance_regression.py
          python validate_nimble_baseline_governance.py

      - name: Validate release attestation
        run: |
          python validate_nimble_release_attestation.py

      - name: Verify attestation commit matches tag
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(
              "reports/nimble/"
              "release-attestation-latest.json"
          )

          attestation = json.loads(
              path.read_text(encoding="utf-8")
          )

          attested = attestation["source"]["commit"]

          release_candidate = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"],
              text=True,
          ).strip()

          if attested != release_candidate:
              raise SystemExit(
                  "Attestation does not bind to the "
                  "release-candidate parent commit: "
                  f"{attested} != {release_candidate}"
              )

          print(
              "PASS: Attestation commit matches tagged "
              "release parent."
          )
          PY

      - name: Upload attested release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nimble-attested-release-${{ github.ref_name }}
          path: |
            nimble/apps/platform-shell/dist
            reports/nimble/release-attestation-latest.json
            reports/nimble/production-gate-latest.json
            reports/nimble/production-gate-latest.md
            reports/nimble/performance-regression-latest.json
            reports/nimble/performance-regression-latest.md
            nimble/governance/performance-baseline.json
            nimble/governance/attestations
          if-no-files-found: error
          retention-days: 30
