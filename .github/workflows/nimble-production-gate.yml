name: Nimble Production Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "aletheus/experience_gateway/**"
      - "nimble/**"
      - "tests/experience_gateway/**"
      - "tests/nimble/**"
      - "validate_nimble_*.py"
      - "validate_nimble_production.sh"
      - ".github/workflows/nimble-production-gate.yml"

  pull_request:
    paths:
      - "aletheus/experience_gateway/**"
      - "nimble/**"
      - "tests/experience_gateway/**"
      - "tests/nimble/**"
      - "validate_nimble_*.py"
      - "validate_nimble_production.sh"
      - ".github/workflows/nimble-production-gate.yml"

  workflow_dispatch:

concurrency:
  group: >-
    nimble-production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gate:
    name: Validate Nimble
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "1"
      NODE_OPTIONS: "--use-system-ca"
      ALETHEUS_AUTH_MODE: "local"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nimble/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install -e ".[dev]"
          else
            echo "No Python dependency manifest found."
            exit 1
          fi

      - name: Install Nimble dependencies
        working-directory: nimble
        run: npm ci

      - name: Validate dependency provenance
        run: |
          python validate_nimble_dependency_manifest.py

      - name: Validate dependency exceptions
        run: |
          python validate_nimble_dependency_exceptions.py

      - name: Scan dependency risk
        run: |
          python -m pip install pip-audit
          python scan_nimble_dependency_risk.py
          python validate_nimble_dependency_risk.py

      - name: Run Experience Gateway tests
        run: |
          python -m pytest -q tests/experience_gateway

      - name: Run Nimble production gate
        run: |
          chmod +x validate_nimble_production.sh
          python collect_nimble_production_telemetry.py

      - name: Validate Nimble production evidence
        if: always()
        run: |
          python validate_nimble_telemetry.py

      - name: Enforce Nimble performance governance
        if: always()
        run: |
          python validate_nimble_performance_regression.py

      - name: Validate Nimble baseline governance
        if: always()
        run: |
          python validate_nimble_baseline_governance.py

      - name: Validate release attestation when present
        if: always()
        run: |
          if [[ -f reports/nimble/release-attestation-latest.json ]]; then
            python validate_nimble_release_attestation.py
          else
            echo "No release attestation present for this commit."
          fi

      - name: Validate container deployment
        run: |
          python validate_nimble_container_contract.py
          docker build \
            --file Dockerfile.nimble \
            --tag aletheus/nimble-experience-gateway:ci \
            --build-arg ALETHEUS_BUILD_VERSION="${GITHUB_REF_NAME:-ci}" \
            --build-arg ALETHEUS_BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg ALETHEUS_BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg ALETHEUS_BUILD_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg ALETHEUS_BUILD_REF_NAME="${GITHUB_REF_NAME:-ci}" \
            .
          python smoke_test_nimble_container.py \
            --image aletheus/nimble-experience-gateway:ci \
            --require-runtime
          python validate_nimble_image_provenance.py
          python inspect_nimble_image_identity.py \
            --image aletheus/nimble-experience-gateway:ci \
            --require-runtime
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          mkdir -p reports/nimble
          "$HOME/.local/bin/syft" \
            aletheus/nimble-experience-gateway:ci \
            -o spdx-json=reports/nimble/nimble-image-sbom.spdx.json
          test -s reports/nimble/nimble-image-sbom.spdx.json
          python generate_nimble_release_manifest.py \
            --release-ref "${GITHUB_REF_NAME:-ci}" \
            --release-version "${GITHUB_REF_NAME:-${GITHUB_SHA::12}}"
          python validate_nimble_release_integrity.py
          python generate_nimble_promotion_record.py \
            --environment build \
            --release "${GITHUB_REF_NAME:-${GITHUB_SHA::12}}"
          python validate_nimble_release_promotion.py \
            --environment build

      - name: Attest Nimble release manifest
        if: ${{ vars.NIMBLE_ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: reports/nimble/nimble-release-manifest.json

      - name: Upload production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimble-production-assets
          path: |
            reports/nimble/nimble-promotion-record.json
            reports/nimble/promotion-validation-latest.json
            nimble/governance/release/promotion-contract.json
            reports/nimble/nimble-release-manifest.json
            reports/nimble/nimble-release-manifest.sha256
            reports/nimble/release-integrity-latest.json
            nimble/governance/release/release-integrity-contract.json
            reports/nimble/image-provenance-contract-latest.json
            reports/nimble/image-identity-latest.json
            reports/nimble/image-digest-latest.json
            reports/nimble/nimble-image-sbom.spdx.json
            nimble/governance/deployment/image-provenance-contract.json
            nimble/apps/platform-shell/dist
            reports/nimble/production-gate-latest.json
            reports/nimble/production-gate-latest.md
            reports/nimble/production-gate-latest.log
            reports/nimble/production-gate-history.jsonl
            reports/nimble/performance-regression-latest.json
            reports/nimble/performance-regression-latest.md
            nimble/governance/supply-chain/dependency-manifest.json
            reports/nimble/dependency-manifest-latest.md
            nimble/governance/supply-chain/dependency-policy.json
            reports/nimble/dependency-risk-latest.json
            reports/nimble/dependency-risk-latest.md
            nimble/governance/supply-chain/dependency-exceptions.json
            reports/nimble/dependency-exceptions-latest.json
            reports/nimble/dependency-exceptions-latest.md
          if-no-files-found: warn
          retention-days: 7
